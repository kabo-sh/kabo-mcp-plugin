name: Verify OpenAI plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the locked verification dependencies
        run: npm ci --ignore-scripts
      - name: Install Pillow for the review-thumbnail regression
        run: python3 -m pip install --user --disable-pip-version-check pillow==11.0.0
      - name: Check the package materials and run the tests
        run: npm run verify
      - name: Build twice from this commit and compare
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          build_root=$(mktemp -d "${RUNNER_TEMP}/kabo-openai-package.XXXXXX")
          npm run build -- --commit "$source_commit" --output "$build_root/first"
          npm run build -- --commit "$source_commit" --output "$build_root/second"
          for archive in "$build_root/first"/*.zip; do
            cmp "$archive" "$build_root/second/$(basename "$archive")"
            unzip -t "$archive"
          done
          printf 'directory=%s\n' "$build_root/first" >> "$GITHUB_OUTPUT"
      - name: Save the candidate package and its source manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kabo-openai-${{ github.sha }}
          path: ${{ steps.package.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
