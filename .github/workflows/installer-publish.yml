name: Publish the kabo-sh installer to npm

# Publishes installer/ as the npm package `kabo-sh` when a tag `installer-v<version>` is pushed. The tag must
# match installer/package.json, point at a commit on main, and pass the installer drift test
# (scripts/installer.test.mjs). Plugin releases (v* tags) never trigger this workflow, and this workflow
# never touches the plugin release, the ZIP or any marketplace.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored in this repository. The package's
# trusted publisher on npmjs.com must name this repository, this workflow file and the `npm-publish`
# environment. Release steps: docs/installer.md.
on:
  push:
    tags: ["installer-v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: installer-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          # This job holds publish credentials and installs nothing; no cache to poison.
          package-manager-cache: false
      - name: Check the tag, the version and the source commit
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./installer/package.json").version')
          if [ "$TAG" != "installer-v$version" ]; then
            echo "::error::Tag $TAG does not match installer/package.json version $version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main."
            exit 1
          fi
          # Trusted publishing needs npm 11.5.1 or newer.
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1).`);
              process.exit(1);
            }' "$(npm -v)"
      - name: Run the installer drift test
        run: node --test scripts/installer.test.mjs
      - name: Show the package contents
        working-directory: installer
        run: npm pack --dry-run
      - name: Publish
        working-directory: installer
        run: npm publish --access public
